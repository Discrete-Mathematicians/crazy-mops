[flake8]
max-line-length = 119
exclude = venv,__pycache__,migrations,.git,docs,node_modules

[isort]
profile = black
line_length = 119
skip = venv,node_modules,migrations

[coverage:run]
omit =
    manage.py
    config/asgi.py
    config/wsgi.py
    */migrations/*
    venv/*
    */tests/*

[djlint]
profile = django
indent = 2
max_line_length = 119
