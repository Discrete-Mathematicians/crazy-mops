name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint:
    name: Линтеры
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install -r requirements-dev.txt
      - run: make lint

  build:
    name: Сборка
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: make install
      - run: venv/bin/python manage.py check
      - run: venv/bin/python manage.py collectstatic --noinput

  test:
    name: Тесты
    runs-on: ubuntu-latest
    needs: [lint, build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install -r requirements.txt
      - run: pip install pytest pytest-django pytest-cov
      - run: python manage.py migrate
        env:
          SECRET_KEY: ci-secret-key
          DEBUG: False
      - name: Запуск тестов с отчётом о покрытии
        run: make test-cov
        env:
          SECRET_KEY: ci-secret-key
          DEBUG: False
          