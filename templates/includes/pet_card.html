{% load static %}
{# Карточка питомца в списке #}
<a href="{% url 'pets:detail' pet.pk %}"
   class="pet-card text-decoration-none">
    {% if pet.avatar %}
        <img src="{{ pet.avatar.url }}"
             alt="{{ pet.name }}"
             class="pet-card-avatar"
             width="96"
             height="96">
    {% else %}
        <img src="{% static 'img/default_pet_avatar.png' %}"
             alt="{{ pet.name }}"
             class="pet-card-avatar"
             width="96"
             height="96">
    {% endif %}
    <span class="pet-card-name">{{ pet.name }}</span>
    <span class="pet-card-sex">{% if pet.sex == 1 %}♂{% elif pet.sex == 2 %}♀{% endif %}</span>
</a>
