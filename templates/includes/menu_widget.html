<div class="flat-panel">
    <div class="panel-header panel-header--compact">Менюшка</div>
    <div class="panel-body panel-body--compact menu-widget">
        {% if user.is_authenticated %}
            <a href="{% url 'profiles:detail' user.pk %}"
               class="{% if request.resolver_match.view_name == 'profiles:detail' and request.resolver_match.kwargs.pk == user.pk %}is-current{% endif %}">
                Моя страница
            </a>
        {% endif %}
        <a href="{% url 'feed:home' %}"
           class="{% if request.resolver_match.view_name == 'feed:home' %}is-current{% endif %}">Лента</a>
        <a href="{% url 'search:search' %}"
           class="{% if request.resolver_match.view_name == 'search:search' %}is-current{% endif %}">Поиск</a>
        {% if user.is_authenticated %}
            <a href="{% url 'users:logout' %}" class="menu-widget__exit">Выход</a>
        {% else %}
            <a href="{% url 'users:login' %}">Войти</a>
        {% endif %}
    </div>
</div>
