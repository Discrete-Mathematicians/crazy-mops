{% if can_subscribe %}
    {% if is_subscribed %}
        <form method="post" action="{% url 'subscriptions:unsubscribe' pet.pk %}">
            {% csrf_token %}
            <button type="submit" class="btn-pixel">Отписаться</button>
        </form>
    {% else %}
        <form method="post" action="{% url 'subscriptions:subscribe' pet.pk %}">
            {% csrf_token %}
            <button type="submit" class="btn-pixel">Подписаться</button>
        </form>
    {% endif %}
{% endif %}
