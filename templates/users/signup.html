{% extends "base.html" %}
{% block title %}Регистрация — Сумасшедший мопс{% endblock title %}
{% block content %}
    <div class="row justify-content-center signup-row">
        <div class="col-12">
            <div class="auth-narrow">
                <div class="flat-panel">
                    <div class="panel-header">Регистрация</div>
                    <div class="panel-body">
                        <form method="post" novalidate>
                            {% csrf_token %}
                            {% include "includes/form_fields.html" with form=form %}
                            <div class="text-center">
                                <button type="submit" class="btn-pixel">Создать аккаунт!</button>
                            </div>
                        </form>
                        <p class="auth-alt">
                            Уже есть аккаунт?
                            <a href="{% url 'users:login' %}">Войти</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
{% endblock content %}
